# Generated By: Claude Code (Claude Opus 4.6)
# Loki recording rules for Claude Code session state derivation.
# Evaluates native OTEL events from Claude Code and writes state
# metrics to Prometheus via remote write.
#
# Key gotchas (validated 2026-06-08):
# - Use observed_timestamp, not event_sequence (sequence resets across
#   session resumes / sandbox reconnects)
# - Filter to event_name="hook_execution_complete" for real hook events
#   (hook_registered events also carry hook_event labels but are not firings)
# - count_over_time does not support by() grouping — wrap with sum by()

groups:
  - name: claude-skill-cost
    interval: 1m
    rules:
      # SKILL_COST: cost attributed to skills via the skill_name field
      # on api_request events. Claude Code sets skill_name during skill
      # execution, including on subagent api_request calls.
      #
      # Covers 73-100% of cost for agent-based skills (review, dump).
      # web_search_tool and web_fetch_apply don't propagate skill_name,
      # so web-heavy skills (cited-research) undercount (~20%).
      # Fix requires Claude Code OTEL change.
      #
      # "third-party" = plugin-provided skills (jewzaam-reviews, etc.)
      #
      # Dashboard: sum_over_time(claude_skill_cost_usd[$__range])
      # ponytail: add token rules when needed, not before
      - record: claude_skill_cost_usd
        expr: |
          sum by (session_id, skill_name, project, host_name, location, sandbox_source, sandbox_openshell_name) (
            sum_over_time(
              {service_name="claude-code"}
              | event_name = "api_request"
              | skill_name != ""
              | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else if hasPrefix "sandbox" .host_name }}~/sandboxes/{{ regexReplaceAll "^sandbox-" .host_name "" }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
              | unwrap cost_usd [1m]
            )
          )

  - name: claude-session-state
    interval: 5s
    rules:
      # WORKING: the newest significant event is activity, not a Stop.
      # Includes main thread and subagent events (same session_id).
      # Excludes housekeeping query sources that fire after Stop.
      #
      # This is the exact inverse of claude_session_ready below, and the same
      # shape codex_session_working already uses. It replaced a
      # `count_over_time(...[60s])` presence count, which went false during any
      # turn that emitted nothing for 60 seconds. Server-side tools are the
      # case that makes that routine rather than rare: the advisor
      # (`/advisor`) runs on Anthropic's side, arriving in the response stream
      # as a `server_tool_use` block named `advisor` and returning an
      # `advisor_tool_result` block. No local tool executes, so it produces no
      # tool_decision, no tool_result, and no hook of any kind. The whole
      # consultation sits inside one in-flight api_request, and api_request
      # only emits on completion. Verified by reading the Claude Code bundle
      # (bin/claude.exe is a Bun single-file executable; the JS is embedded as
      # plain text) at 2.1.269 — there is no client-side event to count.
      # Long tool calls and long background agents had the same hole.
      #
      # `user_prompt` stays in the event list and is now what carries a session
      # through an otherwise silent turn: it is the newest activity from the
      # moment the prompt is submitted until the turn's first api_request
      # lands, which is the 21-80s idle→working gap measured previously.
      #
      # Orchestrated children (jewzaam-reviews `review` skill) are folded into
      # their launching session exactly as before — fold in both WORKING and
      # READY or neither, see the READY comment.
      #
      # Two defaults are load-bearing:
      #
      # 1. The Stop side is padded with `or (0 * <activity>)`. A session's first
      #    turn has activity and no Stop yet; a bare `>` against a missing right
      #    side drops the sample and the session would read not-working for its
      #    whole first turn.
      # 2. The whole rule is padded with `or (0 * <labelled activity>)`, the
      #    same trick the count version used. When Stop is newest the
      #    comparison writes no series at all, the ruler simply stops writing,
      #    and Prometheus's 5m query.lookback-delta keeps serving the last real
      #    sample as current. Consumers must compare
      #    `claude_session_working > 0`, never check presence alone.
      #
      # Cost of the change, accepted: the value is now an event timestamp
      # rather than a count, and a session that dies mid-turn without firing
      # Stop reads WORKING until its activity leaves the window (the count
      # version cleared it after 60s). StopFailure is NOT treated as an
      # end-of-turn here, because READY does not treat it as one either; an
      # errored turn holds WORKING for the rest of the window. Fixing that
      # means adding StopFailure to both rules, not just this one.
      #
      # The [10m] window is measured, not inherited — READY and PERMISSION
      # stay at [30m] because they do a different job (keeping a finished
      # session on the dashboard). Only the activity side binds here: a Stop
      # that falls out of the window hits the `or (0 * activity)` pad and any
      # activity timestamp beats it, and that cannot go wrong on an idle
      # session, because idle means Stop is newer than the last activity, so
      # activity in the window implies Stop in the window. The window
      # therefore means exactly one thing — the longest OTEL-silent stretch
      # inside a turn that stays visible — and since a thinking session and a
      # dead one both emit nothing, the same number is how long a dead session
      # lies about working. One knob, both meanings; no out-of-band liveness
      # signal exists to split them.
      #
      # Measured over 5535 intra-turn gaps (`make measure-turn-gaps`):
      # p50 0.1s, p90 6.0s, p99 57.6s. The old [60s] sat exactly on the p99 —
      # roughly one gap in a hundred blanked the row, which is why slow turns
      # and advisor turns looked idle. Gaps longer than a candidate window, as
      # a share of all gaps: 60s 0.94%, 300s 0.23%, 600s 0.13%, 1800s 0.05%.
      # 600s takes 99.87% and drops only stretches of 10+ minutes of total
      # silence, where working-vs-dead is genuinely ambiguous.
      #
      # The two errors are not symmetric, which is why this is not set higher:
      # too small drops a live row briefly and self-corrects on the next event
      # (claude-dashboard's REMOTE_METRIC_GRACE_SECONDS=120 absorbs it), while
      # too large leaves a dead session claiming WORKING until a human
      # dismisses it.
      #
      # The measured tail is an upper bound on what the window must cover: it
      # still includes time parked at a permission dialog or an
      # AskUserQuestion, and turns that never reached Stop because the user
      # typed again. `make measure-turn-gaps` reports those separately now
      # (`turns_lost_by_window.working_only`); re-measuring can only argue the
      # window down, never up.
      #
      # The floor is a single main-thread api_request, not a whole turn: agent
      # api_requests carry query_source=agent:* and are not filtered out, so
      # agent-heavy sessions are never silent.
      - record: claude_session_working
        expr: |
          (
            max by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name, sandbox_profile) (
              max_over_time(
                {service_name="claude-code"}
                | event_name =~ "api_request|tool_decision|tool_result|skill_activated|subagent_completed|user_prompt"
                | query_source !~ "away_summary|compact|generate_session_title"
                | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else if hasPrefix "sandbox" .host_name }}~/sandboxes/{{ regexReplaceAll "^sandbox-" .host_name "" }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
                | unwrap observed_timestamp [10m]
              ) by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name, sandbox_profile)
            )
            and on (session_id)
            (
              max by (session_id) (
                max_over_time(
                  {service_name="claude-code"}
                  | event_name =~ "api_request|tool_decision|tool_result|skill_activated|subagent_completed|user_prompt"
                  | query_source !~ "away_summary|compact|generate_session_title"
                  | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                  | unwrap observed_timestamp [10m]
                ) by (session_id)
              )
              >
              (
                max by (session_id) (
                  max_over_time(
                    {service_name="claude-code"}
                    | event_name = "hook_execution_complete"
                    | hook_event = "Stop"
                    | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                    | unwrap observed_timestamp [10m]
                  ) by (session_id)
                )
                or
                (
                  0 * max by (session_id) (
                    max_over_time(
                      {service_name="claude-code"}
                      | event_name =~ "api_request|tool_decision|tool_result|skill_activated|subagent_completed|user_prompt"
                      | query_source !~ "away_summary|compact|generate_session_title"
                      | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                      | unwrap observed_timestamp [10m]
                    ) by (session_id)
                  )
                )
              )
            )
          )
          or
          (
            0 * max by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name, sandbox_profile) (
              max_over_time(
                {service_name="claude-code"}
                | event_name =~ "api_request|tool_decision|tool_result|skill_activated|subagent_completed|user_prompt"
                | query_source !~ "away_summary|compact|generate_session_title"
                | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else if hasPrefix "sandbox" .host_name }}~/sandboxes/{{ regexReplaceAll "^sandbox-" .host_name "" }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
                | unwrap observed_timestamp [10m]
              ) by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name, sandbox_profile)
            )
          )

      # READY: Stop hook is the most recent significant event.
      # Compares observed_timestamp (nanoseconds) of last Stop vs last
      # activity event. Truthy when Stop is newer.
      # The `or vector(0)` handles sessions with Stop but no activity
      # events in the window (freshly started then immediately stopped).
      # The comparison runs keyed by session_id ONLY, and `and on (session_id)`
      # filters the label-carrying series by it — see "Compare on session_id".
      #
      # Orchestrated children are folded into their launching session here for
      # the same reason as in WORKING, and folding them in BOTH rules is what
      # makes it work. A child that finishes fires its own Stop hook, so with
      # the rewrite in WORKING alone each child still published a
      # claude_session_ready series under its own session_id — carrying the
      # parent's sandbox labels, because it inherits the parent's environment.
      # claude-dashboard maps every one of those to the same sandbox row via
      # `sandbox_openshell_name`, applies them in poll order, and the last
      # child's READY overwrites the parent's WORKING. Observed live: one
      # orchestrator working, four children ready, row rendered ready.
      # Folded in, a Stop only wins once every agent has stopped and the
      # parent has stopped too — which is exactly when the review is over.
      - record: claude_session_ready
        expr: |
          max by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name, sandbox_profile) (
            max_over_time(
              {service_name="claude-code"}
              | event_name = "hook_execution_complete"
              | hook_event = "Stop"
              | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
              | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else if hasPrefix "sandbox" .host_name }}~/sandboxes/{{ regexReplaceAll "^sandbox-" .host_name "" }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
              | unwrap observed_timestamp [30m]
            ) by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name, sandbox_profile)
          )
          and on (session_id)
          (
            max by (session_id) (
              max_over_time(
                {service_name="claude-code"}
                | event_name = "hook_execution_complete"
                | hook_event = "Stop"
                | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
            >
            max by (session_id) (
              max_over_time(
                {service_name="claude-code"}
                | event_name =~ "api_request|tool_decision|tool_result|user_prompt|subagent_completed"
                | query_source !~ "away_summary|compact|generate_session_title"
                | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
          )

      # PERMISSION_REQUIRED: PermissionRequest is the most recent significant event.
      # Uses timestamp comparison like READY — permission stays active until
      # a tool_result (permission granted) or Stop (denied/cancelled) fires.
      # The comparison runs keyed by session_id ONLY, and `and on (session_id)`
      # filters the label-carrying series by it — see "Compare on session_id".
      #
      # Orchestrated children are DROPPED here rather than folded into their
      # launching session as WORKING and READY do. Dropping them is what stops
      # a child from publishing a permission series that claude-dashboard would
      # map onto the parent's sandbox row. Folding would go further and hand
      # the parent the child's permission state — wrong twice over: nobody can
      # answer a headless agent's prompt, and PERMISSION_REQUIRED is sticky in
      # the dashboard, so it would outlive the review until dismissed by hand.
      - record: claude_session_permission
        expr: |
          max by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name, sandbox_profile) (
            max_over_time(
              {service_name="claude-code"}
              | event_name = "hook_execution_complete"
              | hook_event = "PermissionRequest"
              | review_orchestrating_session_id = ""
              | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else if hasPrefix "sandbox" .host_name }}~/sandboxes/{{ regexReplaceAll "^sandbox-" .host_name "" }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
              | unwrap observed_timestamp [30m]
            ) by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name, sandbox_profile)
          )
          and on (session_id)
          (
            max by (session_id) (
              max_over_time(
                {service_name="claude-code"}
                | event_name = "hook_execution_complete"
                | hook_event = "PermissionRequest"
                | review_orchestrating_session_id = ""
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
            >
            max by (session_id) (
              max_over_time(
                {service_name="claude-code"}
                | event_name =~ "tool_result|user_prompt"
                | query_source !~ "away_summary|compact|generate_session_title"
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
          )

  # Native Codex telemetry puts the durable conversation id on log records,
  # but omits it from Prometheus metrics.  Keep a bounded index in Prometheus
  # solely so Grafana can populate its conversation selector; token/accounting
  # panels query the event records themselves for exact per-conversation data.
  - name: codex-conversation-index
    interval: 5m
    rules:
      - record: codex_conversation_event_count
        expr: |
          sum by (conversation_id, host_name, project, location, sandbox_source, sandbox_openshell_name, sandbox_profile) (
            count_over_time(
              {service_name="codex_cli_rs"}
              | conversation_id != ""
              | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
              [30d]
            )
          )

  - name: codex-session-state
    interval: 5s
    rules:
      # Codex hooks are raw events; state is derived here and remote-written to
      # Prometheus like Claude's. Each rule asserts its own event class IS the
      # latest event for the session, so an old READY or PERMISSION cannot
      # survive a newer prompt or tool event.
      #
      # The label set matches the claude_session_* rules because
      # claude-dashboard joins on it: `sandbox_openshell_name` and
      # `sandbox_source` are what _match_sandbox() uses to put a session on a
      # sandbox row, and `host_name` is what tells a remote session from a local
      # one — without it _add_remote_session() drops the session entirely.
      # See "The `by` clause is the public API" in CLAUDE.md. They arrive as
      # resource attributes from the deployed my-codex-stuff Codex hook.
      #
      # `headless` has no Codex equivalent yet: there is no wrapper marking
      # `codex exec` runs the way claude-wrapper.sh marks `-p`. Absent label
      # reads as interactive downstream, so such runs show as normal sessions.
      #
      # `cwd` and `model` are deliberately NOT grouped on, though the hook
      # emits both. Neither is 1:1 with session_id — `/cd` moves one and
      # `/model` the other — so grouping on them splits a live session into two
      # label shapes mid-flight. The stale shape then holds a state no later
      # event can supersede, because every later event carries the new shape,
      # and claude-dashboard's _wins() arbitrates by identity richness and
      # priority rather than recency. That is the failure described under
      # "Compare on session_id, never on the full label set", reached from the
      # other direction. `project` is the stable path label: pinned at launch
      # from CODEX_PROJECT or, in a sandbox, from /sandbox/.env. A bare `codex`
      # with no wrapper has neither, so its `project` follows `/cd` and splits
      # the same way — launch through bin/codex-wrapper.sh.
      # READY: SessionStart or Stop is the newest event.
      - record: codex_session_ready
        expr: |
          max by (session_id, host_name, project, location, sandbox_source, sandbox_openshell_name, sandbox_profile) (
            max_over_time(
              {service_name="codex-hook-observer"}
              | hook_event_name =~ "SessionStart|Stop"
              | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
              | unwrap observed_timestamp [30m]
            ) by (session_id, host_name, project, location, sandbox_source, sandbox_openshell_name, sandbox_profile)
          )
          and on (session_id)
          (
            max by (session_id) (
              max_over_time(
                {service_name="codex-hook-observer"}
                | hook_event_name =~ "SessionStart|Stop"
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
            ==
            max by (session_id) (
              max_over_time(
                {service_name="codex-hook-observer"}
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
          )

      # WORKING: a prompt/tool/compact event is the newest.
      - record: codex_session_working
        expr: |
          max by (session_id, host_name, project, location, sandbox_source, sandbox_openshell_name, sandbox_profile) (
            max_over_time(
              {service_name="codex-hook-observer"}
              | hook_event_name =~ "UserPromptSubmit|PreToolUse|PostToolUse|PreCompact|PostCompact|SubagentStart|SubagentStop"
              | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
              | unwrap observed_timestamp [30m]
            ) by (session_id, host_name, project, location, sandbox_source, sandbox_openshell_name, sandbox_profile)
          )
          and on (session_id)
          (
            max by (session_id) (
              max_over_time(
                {service_name="codex-hook-observer"}
                | hook_event_name =~ "UserPromptSubmit|PreToolUse|PostToolUse|PreCompact|PostCompact|SubagentStart|SubagentStop"
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
            ==
            max by (session_id) (
              max_over_time(
                {service_name="codex-hook-observer"}
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
          )

      # PERMISSION_REQUIRED: PermissionRequest is the newest event.
      - record: codex_session_permission
        expr: |
          max by (session_id, host_name, project, location, sandbox_source, sandbox_openshell_name, sandbox_profile) (
            max_over_time(
              {service_name="codex-hook-observer"}
              | hook_event_name = "PermissionRequest"
              | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
              | unwrap observed_timestamp [30m]
            ) by (session_id, host_name, project, location, sandbox_source, sandbox_openshell_name, sandbox_profile)
          )
          and on (session_id)
          (
            max by (session_id) (
              max_over_time(
                {service_name="codex-hook-observer"}
                | hook_event_name = "PermissionRequest"
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
            ==
            max by (session_id) (
              max_over_time(
                {service_name="codex-hook-observer"}
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
          )
