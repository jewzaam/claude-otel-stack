# Generated By: Claude Code (Claude Opus 4.6)
# Loki recording rules for Claude Code session state derivation.
# Evaluates native OTEL events from Claude Code and writes state
# metrics to Prometheus via remote write.
#
# Key gotchas (validated 2026-06-08):
# - Use observed_timestamp, not event_sequence (sequence resets across
#   session resumes / sandbox reconnects)
# - Filter to event_name="hook_execution_complete" for real hook events
#   (hook_registered events also carry hook_event labels but are not firings)
# - count_over_time does not support by() grouping — wrap with sum by()

groups:
  - name: claude-skill-cost
    interval: 1m
    rules:
      # SKILL_COST: cost attributed to skills via the skill_name field
      # on api_request events. Claude Code sets skill_name during skill
      # execution, including on subagent api_request calls.
      #
      # Covers 73-100% of cost for agent-based skills (review, dump).
      # web_search_tool and web_fetch_apply don't propagate skill_name,
      # so web-heavy skills (cited-research) undercount (~20%).
      # Fix requires Claude Code OTEL change.
      #
      # "third-party" = plugin-provided skills (jewzaam-reviews, etc.)
      #
      # Dashboard: sum_over_time(claude_skill_cost_usd[$__range])
      # ponytail: add token rules when needed, not before
      - record: claude_skill_cost_usd
        expr: |
          sum by (session_id, skill_name, project, host_name, location, sandbox_source, sandbox_openshell_name) (
            sum_over_time(
              {service_name="claude-code"}
              | event_name = "api_request"
              | skill_name != ""
              | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else if hasPrefix "sandbox" .host_name }}~/sandboxes/{{ regexReplaceAll "^sandbox-" .host_name "" }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
              | unwrap cost_usd [1m]
            )
          )

  - name: claude-session-state
    interval: 5s
    rules:
      # WORKING: activity events in the last 60s.
      # Includes main thread and subagent events (same session_id).
      # Excludes housekeeping query sources that fire after Stop.
      #
      # `user_prompt` is in this list because it is what ends READY: the
      # instant a prompt outranks the last Stop, claude_session_ready goes
      # false. Without it here, a session prompted after >60s idle is in NO
      # state metric until its first api_request lands — measured against live
      # Loki, median 21s and up to 80s — and claude-dashboard drops the row.
      #
      # Orchestrated children (jewzaam-reviews `review` skill: headless
      # `claude -p` agents stamped with the resource attribute
      # `review.orchestrating_session_id`) are counted under the session that
      # launched them, not their own. That session backgrounds the run and
      # stops, so its own events cease and only the Stop hook remains — it
      # reported READY for the entire 15-50 minute review while its agents
      # burned dollars. Rewriting session_id (rather than adding a second
      # metric) also keeps the children out of the dashboard as rows of their
      # own: they are not sessions a user can attach to. Every other label on
      # a child matches its parent — same env, same OTEL resource attributes —
      # so parent and child events sum into one series with no duplicate label
      # set. Verified against live Loki over a real review run.
      #
      # Padded with an explicit 0 (`or 0 * count_over_time(...[10m])`, same
      # trick as claude-skill-cost's review lens count). Without it,
      # count_over_time over an empty 60s window returns no series at all —
      # the ruler just stops writing, it never writes false/0. Prometheus's
      # default 5m query.lookback-delta then keeps serving the last real
      # nonzero sample as "current" to any instant/range query for up to 5
      # minutes after the session actually went idle. Verified live: session
      # 75eb44eb-feb3-4278-906d-e8a972837ed5 went idle at 14:21:38Z (Stop hook
      # 34ms after its last api_request) but still read WORKING=4 at
      # 14:27:15Z. The pad writes a real 0 every 5s for up to 10m after the
      # last activity, closing that window — any consumer must compare
      # `claude_session_working > 0`, not check presence alone, or a padded
      # idle session reads as working (grafana-dashboard-all-in-one.json's
      # "Current Sessions" panel did this — see the `expr` at its `id: 408`
      # panel, fixed alongside this rule). Same caveat applies to
      # claude-dashboard or any other consumer of this metric.
      - record: claude_session_working
        expr: |
          (
            sum by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name) (
              count_over_time(
                {service_name="claude-code"}
                | event_name =~ "api_request|tool_decision|tool_result|skill_activated|subagent_completed|user_prompt"
                | query_source !~ "away_summary|compact|generate_session_title"
                | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else if hasPrefix "sandbox" .host_name }}~/sandboxes/{{ regexReplaceAll "^sandbox-" .host_name "" }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
                [60s]
              )
            )
          )
          or
          (
            0 * sum by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name) (
              count_over_time(
                {service_name="claude-code"}
                | event_name =~ "api_request|tool_decision|tool_result|skill_activated|subagent_completed|user_prompt"
                | query_source !~ "away_summary|compact|generate_session_title"
                | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else if hasPrefix "sandbox" .host_name }}~/sandboxes/{{ regexReplaceAll "^sandbox-" .host_name "" }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
                [10m]
              )
            )
          )

      # READY: Stop hook is the most recent significant event.
      # Compares observed_timestamp (nanoseconds) of last Stop vs last
      # activity event. Truthy when Stop is newer.
      # The `or vector(0)` handles sessions with Stop but no activity
      # events in the window (freshly started then immediately stopped).
      # The comparison runs keyed by session_id ONLY, and `and on (session_id)`
      # filters the label-carrying series by it — see "Compare on session_id".
      #
      # Orchestrated children are folded into their launching session here for
      # the same reason as in WORKING, and folding them in BOTH rules is what
      # makes it work. A child that finishes fires its own Stop hook, so with
      # the rewrite in WORKING alone each child still published a
      # claude_session_ready series under its own session_id — carrying the
      # parent's sandbox labels, because it inherits the parent's environment.
      # claude-dashboard maps every one of those to the same sandbox row via
      # `sandbox_openshell_name`, applies them in poll order, and the last
      # child's READY overwrites the parent's WORKING. Observed live: one
      # orchestrator working, four children ready, row rendered ready.
      # Folded in, a Stop only wins once every agent has stopped and the
      # parent has stopped too — which is exactly when the review is over.
      - record: claude_session_ready
        expr: |
          max by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name) (
            max_over_time(
              {service_name="claude-code"}
              | event_name = "hook_execution_complete"
              | hook_event = "Stop"
              | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
              | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else if hasPrefix "sandbox" .host_name }}~/sandboxes/{{ regexReplaceAll "^sandbox-" .host_name "" }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
              | unwrap observed_timestamp [30m]
            ) by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name)
          )
          and on (session_id)
          (
            max by (session_id) (
              max_over_time(
                {service_name="claude-code"}
                | event_name = "hook_execution_complete"
                | hook_event = "Stop"
                | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
            >
            max by (session_id) (
              max_over_time(
                {service_name="claude-code"}
                | event_name =~ "api_request|tool_decision|tool_result|user_prompt|subagent_completed"
                | query_source !~ "away_summary|compact|generate_session_title"
                | label_format session_id=`{{ if .review_orchestrating_session_id }}{{ .review_orchestrating_session_id }}{{ else }}{{ .session_id }}{{ end }}`
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
          )

      # PERMISSION_REQUIRED: PermissionRequest is the most recent significant event.
      # Uses timestamp comparison like READY — permission stays active until
      # a tool_result (permission granted) or Stop (denied/cancelled) fires.
      # The comparison runs keyed by session_id ONLY, and `and on (session_id)`
      # filters the label-carrying series by it — see "Compare on session_id".
      #
      # Orchestrated children are DROPPED here rather than folded into their
      # launching session as WORKING and READY do. Dropping them is what stops
      # a child from publishing a permission series that claude-dashboard would
      # map onto the parent's sandbox row. Folding would go further and hand
      # the parent the child's permission state — wrong twice over: nobody can
      # answer a headless agent's prompt, and PERMISSION_REQUIRED is sticky in
      # the dashboard, so it would outlive the review until dismissed by hand.
      - record: claude_session_permission
        expr: |
          max by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name) (
            max_over_time(
              {service_name="claude-code"}
              | event_name = "hook_execution_complete"
              | hook_event = "PermissionRequest"
              | review_orchestrating_session_id = ""
              | label_format location=`{{ if .sandbox_source }}~/sandboxes/{{ .sandbox_source }}{{ else if hasPrefix "sandbox" .host_name }}~/sandboxes/{{ regexReplaceAll "^sandbox-" .host_name "" }}{{ else }}{{ regexReplaceAll "^(/home/[^/]+|/Users/[^/]+)" .project "~" }}{{ end }}`
              | unwrap observed_timestamp [30m]
            ) by (session_id, host_name, project, location, headless, sandbox_source, sandbox_openshell_name)
          )
          and on (session_id)
          (
            max by (session_id) (
              max_over_time(
                {service_name="claude-code"}
                | event_name = "hook_execution_complete"
                | hook_event = "PermissionRequest"
                | review_orchestrating_session_id = ""
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
            >
            max by (session_id) (
              max_over_time(
                {service_name="claude-code"}
                | event_name =~ "tool_result|user_prompt"
                | query_source !~ "away_summary|compact|generate_session_title"
                | unwrap observed_timestamp [30m]
              ) by (session_id)
            )
          )
